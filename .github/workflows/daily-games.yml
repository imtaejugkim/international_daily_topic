name: Daily Steam Game Trends

on:
  schedule:
    # 00:00 UTC == 09:00 KST, every day
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Collect and print only, do not post or commit'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      # A step `if` cannot read `secrets`, but it can read `env`.
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- collect ---------------------------------------------------------
      - name: Steam snapshot
        run: python3 steam_collect.py

      # What moved, as opposed to what is big. Must run before the brief.
      - name: Surge signals
        run: python3 steam_signals.py

      # --- read ------------------------------------------------------------
      # Runs on the Claude subscription via CLAUDE_CODE_OAUTH_TOKEN, so this
      # costs no API credit. github_token keeps the action from needing the
      # Claude GitHub App installed: this step touches no GitHub API.
      - name: Write the brief
        if: ${{ !inputs.dry_run && env.HAS_CLAUDE_TOKEN == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: '/game-brief'
          claude_args: |
            --allowedTools "Read,Write,Glob,Grep,Bash,WebSearch,WebFetch"
            --max-turns 60

      # !cancelled() so a failed brief still lets the day be saved. The run is
      # still marked failed, which is what makes the breakage visible.
      - name: Send the brief
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: python3 send_brief.py

      # A brief step that fails silently once cost twelve days of collection:
      # the run went red on GitHub and nothing said so where anyone looks.
      - name: Say the brief failed
        if: ${{ failure() && !inputs.dry_run }}
        run: python3 tools/notify_failure.py

      # --- keep ------------------------------------------------------------
      # Yesterday's numbers are what make today's surge visible, so the daily
      # snapshot is the state everything rests on. It also keeps the repo
      # active, which stops GitHub disabling the schedule after 60 days.
      - name: Commit today's snapshot
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "no data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: steam snapshot $(date -u -d '+9 hours' +%Y-%m-%d)"
          git push
