name: Daily Trends to Discord

on:
  schedule:
    # 00:00 UTC == 09:00 KST, every day
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Collect and print only, do not post or commit'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      # '0' once the brief is running - the raw dumps stay in data/ either way.
      SEND_RAW: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Only needed for the Korean annotation; without ANTHROPIC_API_KEY the
      # pipeline still runs and just shows the original text.
      - name: Install optional deps
        run: pip install --quiet anthropic

      - name: Google Trends keywords
        run: python3 trends_to_discord.py

      - name: Google News headlines
        run: python3 news.py

      - name: App Store charts, reviews and signals
        run: python3 app_charts.py

      # Needs ANTHROPIC_API_KEY; without it the step says so and exits 0.
      - name: Idea brief
        run: python3 ideas.py

      # Committing the daily snapshot is what makes day-over-day signals
      # possible at all, and it doubles as the activity that stops GitHub
      # disabling the schedule after 60 idle days.
      - name: Commit today's snapshot
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "no data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: snapshot $(date -u -d '+9 hours' +%Y-%m-%d)"
          git push
