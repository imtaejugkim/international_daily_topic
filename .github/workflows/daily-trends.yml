name: Daily Trends to Discord

on:
  schedule:
    # 00:00 UTC == 09:00 KST, every day
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Collect and print only, do not post or commit'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      # The raw keyword and chart dumps are lists, not findings - the brief
      # replaces them. Data is kept in data/ regardless; set '1' to see them.
      SEND_RAW: '0'
      # A step `if` cannot read `secrets`, but it can read `env`.
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- collect ---------------------------------------------------------
      - name: Google Trends keywords
        run: python3 trends_to_discord.py

      - name: Google News headlines
        run: python3 news.py

      - name: App Store charts, reviews and signals
        run: python3 app_charts.py

      # Turns the accumulated snapshots into persistence signals - what held
      # for weeks versus what spiked for a day. This is what tells a trend
      # from noise, so it must run before the brief.
      - name: Trend lines from accumulated history
        run: python3 trendlines.py

      # --- read ------------------------------------------------------------
      # Runs on the Claude subscription via CLAUDE_CODE_OAUTH_TOKEN, so this
      # costs no API credit. The skill reads data/ and writes brief.json.
      - name: Write the brief
        if: ${{ !inputs.dry_run && env.HAS_CLAUDE_TOKEN == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without this the action authenticates as the Claude GitHub App and
          # fails with 401 unless that app is installed on the repo. This step
          # only reads data/ and writes brief.json - it touches no GitHub API -
          # so the workflow's own token is enough and needs no install.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: '/daily-brief'
          claude_args: |
            --allowedTools "Read,Write,Glob,Grep,Bash,WebSearch,WebFetch"
            --max-turns 60

      - name: Send the brief
        if: ${{ !inputs.dry_run }}
        run: python3 send_brief.py

      # --- keep ------------------------------------------------------------
      # Committing the daily snapshot is what makes day-over-day signals
      # possible at all, and it doubles as the activity that stops GitHub
      # disabling the schedule after 60 idle days. brief.json is a per-run
      # artifact, not state, so it stays out of the commit.
      - name: Commit today's snapshot
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "no data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: snapshot $(date -u -d '+9 hours' +%Y-%m-%d)"
          git push
